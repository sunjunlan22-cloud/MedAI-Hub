# Netlify 构建与部署配置
# 纯静态 Astro 站点 + 轻量 Serverless 接口（PubMed 检索 / 文献详情 / 文献发送邮箱）。

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "12.18.0"
  # 国内部署（Netlify）的站点地址，供 astro.config.mjs 的 site 生成正确的 canonical/绝对链接
  SITE_URL = "https://medai-hub.netlify.app"

[functions]
  directory = "netlify/functions"

# PubMed 检索 / 文献详情（Serverless，暴露为 /api/pubmed）
[[redirects]]
  from = "/api/pubmed"
  to = "/.netlify/functions/pubmed"
  status = 200
  force = true

# 文献链接邮件发送（Serverless，暴露为 /api/send-literature）
[[redirects]]
  from = "/api/send-literature"
  to = "/.netlify/functions/send-literature"
  status = 200
  force = true

[[headers]]
  for = "/api/pubmed"
  [headers.values]
    Cache-Control = "no-store"
