# 批量发布：把 data/collect 分支累积的采集结果合并到 main，触发 Netlify 原生部署。
#
# 常规每周 3 次（北京时间 周一/三/五 18:30），紧急政策/指南/重要临床信息可手动
# workflow_dispatch 提前发布，或直接向 main 推送（Netlify 原生集成会立即部署）。
#
# 数据安全：采用快速前进（--ff-only）合并，不产生合并提交；data/collect 落后或不存在
# 时直接跳过，不制造空提交、不触发无意义构建。
name: Publish News (批量发布)

on:
  schedule:
    # 北京时间 周一/三/五 18:30（UTC+8 → UTC 10:30）
    - cron: "30 10 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 合并采集分支到 main（快速前进）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data/collect
          if ! git rev-parse --verify origin/data/collect >/dev/null 2>&1; then
            echo "data/collect 分支不存在，无待发布内容，跳过"
            exit 0
          fi
          if git merge-base --is-ancestor HEAD origin/data/collect; then
            git merge --ff-only origin/data/collect
            git push origin main
            echo "已发布 commit $(git rev-parse --short HEAD)"
          else
            echo "data/collect 未领先 main（无新数据或已发布），跳过"
          fi
