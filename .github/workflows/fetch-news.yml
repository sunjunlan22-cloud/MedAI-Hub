# 【PRD 15.2 硬约束】本工作流仅允许写入 src/data/auto/，严禁触碰指南/工具等受保护内容。
#
# 采集与发布解耦：本工作流只把采集结果推到 data/collect 分支，不推送 main，
# 因此不会触发 Netlify 生产部署（Netlify 原生集成只监听 main）。
# 生产上线由 publish-news.yml 定期批量合并 collect → main 完成。
name: Fetch News (资讯采集)

on:
  schedule:
    # 北京时间 08:30 与 18:00（UTC+8 → UTC 00:30 / 10:00）
    - cron: "30 0 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 运行资讯采集脚本
        run: python scripts/fetch_news.py

      - name: 提交到采集分支（不推送 main）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 隔离提交：仅暂存自动化目录，从根源上杜绝误改受保护路径
          git add src/data/auto/
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交（不推送、不触发部署）"
            exit 0
          fi
          git commit -m "chore(news): 采集数据更新（待批量发布）"
          # 快照式写入 data/collect：始终等于 main + 本次完整采集结果
          git push origin HEAD:refs/heads/data/collect --force
